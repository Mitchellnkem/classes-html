<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<h2>HTML Forms</h2>

<form action="" >
  <label for="fname">First name:</label><br>
  <input type="name" id="fname" name="fname" placeholder="g" value="Ghana" disabled required><br>
  <label for="lname">Last name:</label><br>
  <input type="text" id="lname" name="lname" value="Doe" required><br><br>
  <input type="submit" value="Submit"><br><br>


  <select name="" id="">
	<option value="gh">Ghana</option>
	<option value="ng">Nigeria</option>
	<option value="sa">South Africa</option>
  </select><br><br>

  <textarea name="bio"> Tell us about yourself</textarea>

</form> 

<hr>

<!-- Method 1: input type submit -->
<input type="submit" value="Register Now">

<!-- Method 2: button tag (more flexible — can have HTML inside) -->
<button type="Register"> Now</button>

<!-- Reset button — clears the entire form -->
<button type="reset">Clear Form</button> <br><br>

<!-- Regular button — does nothing by default (used with JavaScript) -->
<button type="button">Click Me</button>



<!-- <p>If you click the "Submit" button, the form-data will be sent to a page called "/action_page.php".</p> -->

</body>
</html>
