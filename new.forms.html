<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
<link rel="stylesheet" href="new.forms.css">
</head>
<body>
	<div class="form-container">
		<header class="form-header">
			<h2>Get in Touch</h2>
			<p>Have questions or feedback? We'd love to hear from you! Please fill out the form below</p>



			<form action="#" method="POST">
				<div class="form-row">
					<div class="form-group">
						<label for="first-name">First Name</label>
						<input type="text" id="first-name" name="first-name" placeholder="Jane" required>
					</div>
					<div class="form-group">
						<label for="last-name">Last Name</label>
						<input type="text" id="last-name" name="last-name" placeholder="Doe" required>
					</div>
				</div>

				<div class="form-group">
					<label for="email">Email Address</label>
					<input type="email" id="email" name="email" placeholder="jane@example.com" required>
				</div>

				<div class="form-group">
					<label for="subject">Subject</label>
					<select id="subject" name="subject">
						<option value="general">General Inquiry</option>
						<option value="support">Technical Support</option>
						<option value="billing">Billing</option>
					</select>
				</div>

				<div class="form-group">
					<label for="message">Message</label>
					<textarea id="message" name="message" rows="5" placeholder="How can we help?"></textarea>
				</div>

				<button type="submit" class="submit-btn">Send Message</button>
        	</form>
		</header>
	</div>
</body>
</html>
